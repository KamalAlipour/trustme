# TrustMe has separate hostnames and a separate vhost from FairFare.
# FairFare failover stops nginx on Server 1, which also takes this vhost
# offline. TrustMe therefore has its own promote path.
limit_req_zone $binary_remote_addr zone=trustme_admin_login:10m rate=10r/m;

server {
    listen 80;
    server_name __TRUSTME_API_HOST__;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /admin/login {
        limit_req zone=trustme_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3121;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3121;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name __TRUSTME_ADMIN_HOST__;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /login {
        limit_req zone=trustme_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3122;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3122;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After DNS is pointed at this host, obtain certificates (do not run this
# command automatically): certbot --nginx -d API_HOST -d ADMIN_HOST
# Certbot can then add the HTTPS listeners and redirect HTTP to HTTPS.
